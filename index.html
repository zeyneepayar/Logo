<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Logo</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Base Styles -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Header Module Styles -->
    <link rel="stylesheet" href="css/topbar.css">
    <link rel="stylesheet" href="css/mainheader.css">
    <link rel="stylesheet" href="css/mobileheader.css">
    <link rel="stylesheet" href="css/bottombar.css">
    <link rel="stylesheet" href="css/tabs.css">
    <link rel="stylesheet" href="css/hero-banner.css">
    <link rel="stylesheet" href="css/product-showcase.css">
    <link rel="stylesheet" href="css/info-section.css">
    <link rel="stylesheet" href="css/industries-showcase.css">
    <link rel="stylesheet" href="css/on-premise-section.css">
</head>
<body>
    <!-- Top Bar Component -->
    <div id="topbarContainer"></div>

    <!-- Main Header Component -->
    <div id="mainHeaderContainer"></div>

    <!-- Mobile Header Component -->
    <div id="mobileHeaderContainer"></div>

    <!-- Tab Navigation Component -->
    <div id="tabNavigationContainer"></div>

    <!-- Tab Content Sections -->
    <div id="tabContentContainer"></div>

    <!-- Bottom Action Bar Component -->
    <div id="bottomBarContainer"></div>

    <!-- Module Scripts -->
    <script src="js/modules/topbar.js"></script>
    <script src="js/modules/mainheader.js"></script>
    <script src="js/modules/mobileheader.js"></script>
    <script src="js/modules/bottombar.js"></script>
    <script src="js/modules/tabs.js"></script>
    
    <!-- Info Section Data & Module -->
    <script src="js/data/info-section-data.js"></script>
    <script src="js/modules/info-section.js"></script>
    
    <!-- Industries Showcase Data & Module -->
    <script src="js/data/industries-data.js"></script>
    <script src="js/modules/industries-showcase.js"></script>
    
    <!-- On-Premise Section Data & Module -->
    <script src="js/data/on-premise-data.js"></script>
    <script src="js/modules/on-premise.js"></script>
    
    <!-- ================================================================== -->
    <!-- COMPONENT LOADERS - Modüler Yükleme Sistemi                       -->
    <!-- ================================================================== -->
    <!-- 
        Yeni mimari tasarım:
        - Her loader kendi sorumluluğuna odaklanır
        - BaseComponentLoader tüm loader'ların base class'ıdır
        - AppLoader tüm loader'ları koordine eder
    -->
    
    <!-- Base Loader (tüm loader'lar için temel sınıf) -->
    <script src="js/loaders/BaseComponentLoader.js"></script>
    
    <!-- Özel Loader'lar (alfabetik sıra) -->
    <script src="js/loaders/HeaderLoader.js"></script>
    <script src="js/loaders/InfoSectionLoader.js"></script>
    <script src="js/loaders/IndustriesLoader.js"></script>
    <script src="js/loaders/OnPremiseLoader.js"></script>
    <script src="js/loaders/ProductShowcaseLoader.js"></script>
    <script src="js/loaders/TabLoader.js"></script>
    
    <!-- Ana Koordinatör (tüm loader'ları başlatır) -->
    <script src="js/loaders/AppLoader.js"></script>
    
    <!-- ================================================================== -->
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
