<!-- Product Showcase Component -->
<section class="product-showcase">
    <div class="showcase-container">
        <div class="showcase-header">
            <p class="showcase-subtitle">Logo Yazılım ile</p>
            <h2 class="showcase-title">Farklı ihtiyaçlara en uygun ürünler</h2>
            <div class="showcase-tabs">
                <button class="showcase-tab-btn active" data-showcase-tab="kategori">Kategoriye göre</button>
                <button class="showcase-tab-btn" data-showcase-tab="sektor">Sektöre göre</button>
            </div>
        </div>

        <div class="showcase-content-wrapper">
            <!-- Kategoriye Göre -->
            <div class="showcase-content active" data-showcase-content="kategori">
                <div class="product-grid">
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-chart-line"></i>
                        </div>
                        <h3 class="product-name">ERP Programı</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-users"></i>
                        </div>
                        <h3 class="product-name">İnsan Kaynakları Yazılımı</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-shop"></i>
                        </div>
                        <h3 class="product-name">Perakende Satış Programı</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-laptop"></i>
                        </div>
                        <h3 class="product-name">e-Dönüşüm</h3>
                    </div>
                    <!-- Hepsini İncele Card -->
                    <a href="#" class="product-card view-all-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                        <h3 class="product-name">Hepsini incele</h3>
                    </a>
                </div>
            </div>

            <!-- Sektöre Göre -->
            <div class="showcase-content" data-showcase-content="sektor">
                <div class="product-grid">
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-store"></i>
                        </div>
                        <h3 class="product-name">Perakende</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-industry"></i>
                        </div>
                        <h3 class="product-name">Üretim</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-building"></i>
                        </div>
                        <h3 class="product-name">Hizmet</h3>
                    </div>
                    <div class="product-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-truck"></i>
                        </div>
                        <h3 class="product-name">Lojistik</h3>
                    </div>
                    <!-- Hepsini İncele Card -->
                    <a href="#" class="product-card view-all-card">
                        <div class="product-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                        <h3 class="product-name">Hepsini incele</h3>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
