<!-- Main Header - Ekran görüntüsüne göre yeniden oluşturuldu -->
<header class="main-header">
    <div class="header-container">
        <!-- Logo -->
        <div class="logo">
            <a href="/">
                <img src="assets/images/logo.webp" alt="Logo" class="logo-img">
            </a>
        </div>

        <!-- Ana Menü -->
        <nav class="main-nav">
            <!-- Ürünler -->
            <div class="nav-item">
                <button class="nav-link">
                    Ürünler
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Ürün 1</a>
                    <a href="#" class="dropdown-item">Ürün 2</a>
                    <a href="#" class="dropdown-item">Ürün 3</a>
                </div>
            </div>

            <!-- Hizmetler -->
            <div class="nav-item">
                <button class="nav-link">
                    Hizmetler
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Hizmet 1</a>
                    <a href="#" class="dropdown-item">Hizmet 2</a>
                    <a href="#" class="dropdown-item">Hizmet 3</a>
                </div>
            </div>

            <!-- Sektörler -->
            <div class="nav-item">
                <button class="nav-link">
                    Sektörler
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Sektör 1</a>
                    <a href="#" class="dropdown-item">Sektör 2</a>
                    <a href="#" class="dropdown-item">Sektör 3</a>
                </div>
            </div>

            <!-- İş ortakları -->
            <div class="nav-item">
                <button class="nav-link">
                    İş ortakları
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Ortak 1</a>
                    <a href="#" class="dropdown-item">Ortak 2</a>
                </div>
            </div>

            <!-- Destek -->
            <div class="nav-item">
                <button class="nav-link">
                    Destek
                    <span class="dropdown-arrow">▼</span>
                </button>
                <div class="dropdown-menu">
                    <a href="#" class="dropdown-item">Destek 1</a>
                    <a href="#" class="dropdown-item">Destek 2</a>
                </div>
            </div>

            <!-- Kampanyalar -->
            <div class="nav-item">
                <a href="#kampanyalar" class="nav-link">Kampanyalar</a>
            </div>
        </nav>

        <!-- Sağ Taraf: Arama ve Fiyat Al -->
        <div class="header-right">
            <!-- Arama Kutusu -->
            <div class="search-container">
                <input type="text" placeholder="Ara" class="search-input">
                <button class="search-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                        <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2"/>
                    </svg>
                </button>
            </div>

            <!-- Fiyat Al Butonu -->
            <button class="cta-button">Fiyat Al</button>
        </div>

        <!-- Mobil Menü Toggle -->
        <button class="mobile-toggle" aria-label="Menü">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
